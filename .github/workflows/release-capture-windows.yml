name: Release Capture Windows Installer

on:
  push:
    tags:
      - "capture-v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to create or update, for example capture-v0.1.5
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-capture-windows:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build Capture Windows installer
        run: npm run capture:dist:win

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: roomboard-capture-windows-release-${{ github.run_number }}
          path: |
            dist-capture/*.exe
            dist-capture/*.blockmap
            dist-capture/latest*.yml
          if-no-files-found: error

      - name: Resolve release tag
        id: release_tag
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.release_tag }}" ]; then
            echo "tag=${{ github.event.inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        shell: bash
        run: |
          shopt -s nullglob
          assets=(dist-capture/*.exe dist-capture/*.blockmap dist-capture/latest*.yml)

          if [ ${#assets[@]} -eq 0 ]; then
            echo "No capture release assets were generated."
            exit 1
          fi

          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "RoomBoard Capture $RELEASE_TAG" \
              --notes "RoomBoard Capture installer release. Mac and Windows assets upload to this same release." \
              || gh release view "$RELEASE_TAG" >/dev/null
          fi

          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber

      - name: Publish rolling auto-update alias (capture-latest)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          shopt -s nullglob
          assets=(dist-capture/*.exe dist-capture/*.blockmap dist-capture/latest*.yml)

          if [ ${#assets[@]} -eq 0 ]; then
            echo "No capture release assets were generated."
            exit 1
          fi

          if ! gh release view capture-latest >/dev/null 2>&1; then
            gh release create capture-latest \
              --target "$GITHUB_SHA" \
              --title "RoomBoard Capture (auto-update feed)" \
              --notes "Rolling alias that always holds the newest Capture build. Used only by the app's auto-updater — for a real download, use the versioned release above." \
              --prerelease \
              || gh release view capture-latest >/dev/null
          fi

          gh release upload capture-latest "${assets[@]}" --clobber
