<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="#0d8b85"/>

  <!-- Clock circle -->
  <circle cx="256" cy="256" r="188" fill="none" stroke="white" stroke-width="14"/>

  <!-- Cardinal ticks (longer) -->
  <line x1="256" y1="68" x2="256" y2="104" stroke="white" stroke-width="13" stroke-linecap="round"/>
  <line x1="444" y1="256" x2="408" y2="256" stroke="white" stroke-width="13" stroke-linecap="round"/>
  <line x1="256" y1="444" x2="256" y2="408" stroke="white" stroke-width="13" stroke-linecap="round"/>
  <line x1="68" y1="256" x2="104" y2="256" stroke="white" stroke-width="13" stroke-linecap="round"/>

  <!-- Intermediate ticks (shorter) — 30° intervals -->
  <!-- 1 o'clock (30°) -->
  <line x1="350" y1="92" x2="333" y2="121" stroke="white" stroke-width="9" stroke-linecap="round"/>
  <!-- 2 o'clock (60°) -->
  <line x1="420" y1="162" x2="394" y2="177" stroke="white" stroke-width="9" stroke-linecap="round"/>
  <!-- 4 o'clock (120°) -->
  <line x1="420" y1="350" x2="394" y2="335" stroke="white" stroke-width="9" stroke-linecap="round"/>
  <!-- 5 o'clock (150°) -->
  <line x1="350" y1="420" x2="333" y2="391" stroke="white" stroke-width="9" stroke-linecap="round"/>
  <!-- 7 o'clock (210°) -->
  <line x1="162" y1="420" x2="179" y2="391" stroke="white" stroke-width="9" stroke-linecap="round"/>
  <!-- 8 o'clock (240°) -->
  <line x1="92" y1="350" x2="118" y2="335" stroke="white" stroke-width="9" stroke-linecap="round"/>
  <!-- 10 o'clock (300°) -->
  <line x1="92" y1="162" x2="118" y2="177" stroke="white" stroke-width="9" stroke-linecap="round"/>
  <!-- 11 o'clock (330°) -->
  <line x1="162" y1="92" x2="179" y2="121" stroke="white" stroke-width="9" stroke-linecap="round"/>

  <!-- Stethoscope -->
  <!-- Earpiece balls -->
  <circle cx="186" cy="168" r="11" fill="white"/>
  <circle cx="326" cy="168" r="11" fill="white"/>

  <!-- Headset arch (curves upward between earpiece balls) -->
  <path d="M186,168 Q256,128 326,168" fill="none" stroke="white" stroke-width="12" stroke-linecap="round"/>

  <!-- Left binaural (from earpiece, curves outward then inward to Y junction) -->
  <path d="M186,168 C172,208 205,234 256,240" fill="none" stroke="white" stroke-width="12" stroke-linecap="round"/>

  <!-- Right binaural -->
  <path d="M326,168 C340,208 307,234 256,240" fill="none" stroke="white" stroke-width="12" stroke-linecap="round"/>

  <!-- Main tube: down from Y junction then curves right toward chest piece -->
  <path d="M256,240 C256,288 272,308 305,318" fill="none" stroke="white" stroke-width="12" stroke-linecap="round"/>

  <!-- Chest piece outer ring -->
  <circle cx="305" cy="318" r="38" fill="none" stroke="white" stroke-width="12"/>

  <!-- Chest piece inner ring -->
  <circle cx="305" cy="318" r="18" fill="none" stroke="white" stroke-width="9"/>

  <!-- Small tail curl at bottom of chest piece -->
  <path d="M305,356 Q298,374 285,368" fill="none" stroke="white" stroke-width="12" stroke-linecap="round"/>
</svg>
